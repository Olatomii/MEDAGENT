name: Tests

on:
  push:
    branches: [main, fix/medagent-bugs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        env:
          MEDAGENT_V2_REMINDERS_ENABLED: 'false'
          REMINDERS_ENABLED: 'false'
        run: python -m pytest -q
