name: Tests

on:
  push:
    branches: [main, fix/medagent-bugs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        backend: [sqlite, postgres]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        env:
          MEDAGENT_TEST_POSTGRES_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:test-only-password@localhost:5432/postgres' || '' }}
          MEDAGENT_V2_REMINDERS_ENABLED: 'false'
          REMINDERS_ENABLED: 'false'
        run: python -m pytest -q
